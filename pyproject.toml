[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indlan"
version = "2.1.3"
description = "IndLan Programming Language - Hindi + English Python Ecosystem Interface - VSCode Edition IDE with File Explorer, Find/Replace, and Enhanced Features"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Bhavya S Solanki" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Interpreters",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
]
dependencies = []

[tool.setuptools]
py-modules = ["ast_nodes", "indlan", "indlan_ide", "ind_parser", "interpreter", "lexer", "py_bridge"]

[project.scripts]
indlan = "indlan:main"
indlan-ide = "indlan_ide:main"

[project.optional-dependencies]
data = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "openpyxl",
    "xlsxwriter",
    "joblib"
]

ml = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "joblib",
    "openpyxl"
]

ai = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "joblib",
    "tensorflow",
    "keras",
    "torch",
    "torchvision",
    "pillow"
]

full = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "plotly",
    "openpyxl",
    "xlsxwriter",
    "joblib",
    "tensorflow",
    "keras",
    "torch",
    "torchvision",
    "pillow",
    "opencv-python",
    "nltk",
    "spacy",
    "transformers"
]
